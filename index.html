  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #1D9E75; --green-dark: #0F6E56; --green-light: #E1F5EE;
      --text: #1a1a1a; --muted: #6b7280; --border: #e5e7eb;
      --bg: #f9fafb; --white: #ffffff; --red: #E24B4A;
      --amber: #EF9F27; --purple-bg: #EEEDFE; --purple-text: #3C3489;
      --coral-bg: #FAECE7; --coral-text: #993C1D;
      --radius: 10px; --radius-lg: 14px;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text); background: var(--white); font-size: 15px; line-height: 1.6; }

    /* NAV */
    nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; border-bottom: 1px solid var(--border); background: var(--white); position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 22px; font-weight: 700; color: var(--text); text-decoration: none; letter-spacing: -0.5px; }
    .logo span { color: var(--green); }
    .nav-right { display: flex; gap: 24px; font-size: 14px; color: var(--muted); align-items: center; }
    .nav-right a { color: var(--muted); text-decoration: none; }
    .nav-right a:hover { color: var(--text); }
    .nav-signin { color: var(--green) !important; font-weight: 500; border: 1px solid var(--green); padding: 6px 16px; border-radius: var(--radius); }
    .nav-signin:hover { background: var(--green-light) !important; }

    /* HERO */
    #hero { padding: 72px 32px 56px; text-align: center; transition: padding 0.25s ease; }
    #hero.compact { padding: 18px 32px; }
    .hero-inner { max-width: 680px; margin: 0 auto; }
    .hero-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; background: var(--green-light); color: var(--green-dark); padding: 5px 14px; border-radius: 20px; margin-bottom: 22px; transition: all 0.25s; }
    #hero.compact .hero-tag { font-size: 0; margin: 0; padding: 0; }
    #hero h1 { font-size: clamp(28px, 4vw, 42px); font-weight: 700; line-height: 1.15; letter-spacing: -1px; margin-bottom: 14px; transition: all 0.25s; }
    #hero.compact h1 { font-size: 0; margin: 0; }
    #hero h1 span { color: var(--green); }
    #hero p.sub { font-size: 16px; color: var(--muted); margin-bottom: 32px; line-height: 1.6; transition: all 0.25s; }
    #hero.compact p.sub { font-size: 0; margin: 0; }

    /* SEARCH */
    .search-outer { max-width: 580px; margin: 0 auto; }
    .search-wrap { display: flex; border: 1.5px solid var(--border); border-radius: 50px; background: var(--white); overflow: hidden; box-shadow: 0 2px 16px rgba(0,0,0,0.06); transition: box-shadow 0.2s, border-color 0.2s; }
    .search-wrap:focus-within { border-color: var(--green); box-shadow: 0 0 0 3px rgba(29,158,117,0.12); }
    .search-wrap input { flex: 1; border: none; outline: none; padding: 15px 20px; font-size: 15px; background: transparent; color: var(--text); }
    .search-wrap input::placeholder { color: #aaa; }
    #clear-btn { background: none; border: none; cursor: pointer; padding: 0 10px; color: var(--muted); font-size: 20px; display: none; align-items: center; }
    #search-btn { padding: 10px 22px; margin: 5px 6px; background: var(--green); color: #fff; border: none; cursor: pointer; font-size: 14px; font-weight: 600; border-radius: 40px; white-space: nowrap; transition: background 0.15s; }
    #search-btn:hover { background: var(--green-dark); }
